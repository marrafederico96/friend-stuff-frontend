<h2 mat-dialog-title>Add Participants</h2>
<mat-dialog-content>
    <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput [formControl]="searchControl" placeholder="Username" />
    </mat-form-field>

    @if (error()) {
    <mat-error>{{ error()?.message }}</mat-error>
    }

    @if (responseUsername()) {
    <mat-chip-option (click)="addUser()">
        <mat-icon matChipAvatar>person</mat-icon>
        {{ responseUsername() }}
    </mat-chip-option>
    }

    <mat-chip-set>
        @for (username of selectedUsernames(); track username) {
        <mat-chip-row (removed)="removeUser(username)">
            {{ username }}
            <button matChipRemove>
                <mat-icon>cancel</mat-icon>
            </button>
        </mat-chip-row>
        } @empty {
        <mat-chip>No users selected</mat-chip>
        }
    </mat-chip-set>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton (click)="close()">Cancel</button>
    <button matButton="tonal" [disabled]="isLoading() || selectedUsernames().length === 0" (click)="confirm()">
        @if (isLoading()) {
        <mat-spinner diameter="20"></mat-spinner>
        } @else {
        Add ({{ selectedUsernames().length }})
        }
    </button>
</mat-dialog-actions>
