<h2 mat-dialog-title>Create Expense</h2>
<mat-dialog-content>
    <form [formGroup]="expenseForm">
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input matInput required placeholder="Expense name" formControlName="name" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Description</mat-label>
            <input matInput placeholder="Expense descritpion (optional)" formControlName="description" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Amount</mat-label>
            <input matInput required placeholder="Amount" type="number" formControlName="amount" />
        </mat-form-field>
        @if(error()) {
        <mat-error>{{error()?.message}}</mat-error>
        }
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="close()">Cancel</button>
    <button matButton="tonal" (click)="onSubmit()" [disabled]="">
        @if(isLoading()) {
        <mat-spinner diameter=20></mat-spinner>
        } @else {
        Create
        }
    </button>
</mat-dialog-actions>
