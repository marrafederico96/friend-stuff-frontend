<h2 mat-dialog-title>Add Participant</h2>
<mat-dialog-content>
    <form>
        <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input matInput required placeholder="Username" formControlName="username" />
        </mat-form-field>
        @if(error()) {
        <mat-error>{{error()?.message}}</mat-error>
        }
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button matButton (click)="close()">Cancel</button>
    <button matButton="tonal" [disabled]="isLoading()">
        @if(isLoading()) {
        <mat-spinner diameter=20></mat-spinner>
        } @else {
        Add
        }
    </button>
</mat-dialog-actions>
